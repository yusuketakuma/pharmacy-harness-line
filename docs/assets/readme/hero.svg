<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
  <rect x="0" y="0" width="960" height="420" rx="16" fill="#ffffff" stroke="#d0d7de"/>
  <text x="480" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#24292f">Pharmacy Harness for LINE — 全体像</text>
  <text x="480" y="68" text-anchor="middle" font-size="13" fill="#57606a">患者の LINE から薬局の受付業務、そして運営者の横断管理まで、Cloudflare 上の 1 つの Worker と D1 で運用する</text>

  <!-- patient -->
  <g transform="translate(40,110)">
    <rect width="220" height="240" rx="14" fill="#e8f8ee" stroke="#06c755" stroke-width="1.5"/>
    <text x="110" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#0b5c2c">患者 (LINE / LIFF)</text>
    <rect x="70" y="48" width="80" height="150" rx="12" fill="#ffffff" stroke="#8fd8a8"/>
    <rect x="78" y="60" width="64" height="10" rx="3" fill="#06c755"/>
    <rect x="78" y="78" width="64" height="24" rx="4" fill="#e8f8ee" stroke="#8fd8a8"/>
    <text x="110" y="94" text-anchor="middle" font-size="8" fill="#0b5c2c">処方せん事前送信</text>
    <rect x="78" y="108" width="64" height="24" rx="4" fill="#e8f8ee" stroke="#8fd8a8"/>
    <text x="110" y="124" text-anchor="middle" font-size="8" fill="#0b5c2c">電子処方箋</text>
    <rect x="78" y="138" width="64" height="24" rx="4" fill="#e8f8ee" stroke="#8fd8a8"/>
    <text x="110" y="154" text-anchor="middle" font-size="8" fill="#0b5c2c">緊急避妊薬</text>
    <rect x="78" y="168" width="64" height="24" rx="4" fill="#e8f8ee" stroke="#8fd8a8"/>
    <text x="110" y="184" text-anchor="middle" font-size="8" fill="#0b5c2c">服薬後フォロー</text>
    <text x="110" y="222" text-anchor="middle" font-size="11" fill="#57606a">アプリ不要・LINE 内で完結</text>
  </g>

  <!-- cloudflare core -->
  <g transform="translate(320,110)">
    <rect width="320" height="240" rx="14" fill="#fff7e6" stroke="#f48120" stroke-width="1.5"/>
    <text x="160" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#7a3e00">Cloudflare</text>
    <rect x="24" y="52" width="272" height="64" rx="10" fill="#ffffff" stroke="#f4b26b"/>
    <text x="160" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#24292f">Worker (Hono)</text>
    <text x="160" y="100" text-anchor="middle" font-size="11" fill="#57606a">API / LIFF 配信 / Webhook / cron</text>
    <rect x="24" y="130" width="128" height="60" rx="10" fill="#ffffff" stroke="#f4b26b"/>
    <text x="88" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#24292f">D1 (SQLite)</text>
    <text x="88" y="175" text-anchor="middle" font-size="10" fill="#57606a">tenant 境界付き</text>
    <rect x="168" y="130" width="128" height="60" rx="10" fill="#ffffff" stroke="#f4b26b"/>
    <text x="232" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#24292f">R2 / Secrets</text>
    <text x="232" y="175" text-anchor="middle" font-size="10" fill="#57606a">処方せん画像・鍵</text>
    <text x="160" y="222" text-anchor="middle" font-size="11" fill="#57606a">Pages (Next.js) が管理画面を配信</text>
  </g>

  <!-- staff + platform admin -->
  <g transform="translate(700,110)">
    <rect width="220" height="112" rx="14" fill="#eaf2fd" stroke="#0969da" stroke-width="1.5"/>
    <text x="110" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0a3069">薬局スタッフ 管理画面</text>
    <text x="110" y="56" text-anchor="middle" font-size="11" fill="#24292f">処方せん受付 / 患者対応</text>
    <text x="110" y="74" text-anchor="middle" font-size="11" fill="#24292f">機能設定 / 薬局情報</text>
    <text x="110" y="92" text-anchor="middle" font-size="11" fill="#24292f">コンプライアンス</text>
    <rect y="128" width="220" height="112" rx="14" fill="#f3eefc" stroke="#8250df" stroke-width="1.5"/>
    <text x="110" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#3e1f8a">全体管理者 (運営)</text>
    <text x="110" y="184" text-anchor="middle" font-size="11" fill="#24292f">tenant 作成 / readiness</text>
    <text x="110" y="202" text-anchor="middle" font-size="11" fill="#24292f">support grant (期限付き)</text>
    <text x="110" y="220" text-anchor="middle" font-size="11" fill="#24292f">監査ログ</text>
  </g>

  <!-- arrows -->
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#57606a"/></marker></defs>
  <line x1="262" y1="230" x2="318" y2="230" stroke="#57606a" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <line x1="642" y1="166" x2="698" y2="166" stroke="#57606a" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <line x1="642" y1="294" x2="698" y2="294" stroke="#57606a" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="290" y="222" text-anchor="middle" font-size="9" fill="#57606a">LINE</text>
  <text x="480" y="392" text-anchor="middle" font-size="12" fill="#57606a">LINE Harness (OSS CRM) をフォークし、薬局業務に必要な画面・データ境界・監査を custom/pharmacy として追加</text>
</svg>
