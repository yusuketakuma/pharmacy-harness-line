name: Repository Verify

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan new commits for secrets
        if: github.event_name != 'workflow_dispatch'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_VERSION: 8.30.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
        with:
          languages: javascript-typescript

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run dependency and license baseline
        run: |
          mkdir -p assurance
          pnpm audit --prod --audit-level high
          pnpm licenses list --prod --json > assurance/licenses.json
          jq -e '[keys[] | select(test("unknown|unlicensed"; "i"))] | length == 0' assurance/licenses.json

      - name: Generate CycloneDX SBOM
        run: |
          pnpm exec cdxgen -t js --required-only --no-babel --no-install-deps --spec-version 1.6 --fail-on-error --output assurance/sbom.cdx.json .
          jq -e '.bomFormat == "CycloneDX" and .specVersion == "1.6" and (.components | length > 0)' assurance/sbom.cdx.json

      - name: Build shared packages
        run: pnpm --filter @line-crm/shared --filter @line-crm/line-sdk --filter @line-crm/db --filter @line-harness/update-engine --filter @line-harness/sdk build

      - run: pnpm verify:ci

      - name: Build critical applications
        run: pnpm --filter worker --filter web --filter liff build
        env:
          VITE_CALENDAR_CONNECTION_ID: ci-calendar
          NEXT_PUBLIC_API_URL: https://worker.example.invalid
          NEXT_PUBLIC_LIFF_ORIGIN: https://liff.example.invalid
          VITE_API_BASE: https://worker.example.invalid

      - name: Install Chromium
        run: pnpm --filter liff exec playwright install --with-deps chromium

      - name: Run LIFF browser smoke
        run: pnpm --filter liff test:e2e

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28

      - name: Create synthetic assurance artifact
        run: |
          tar -czf assurance/synthetic-build.tar.gz \
            apps/worker/dist apps/web/out apps/liff/dist \
            assurance/licenses.json assurance/sbom.cdx.json

      - name: Upload assurance artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v031-assurance-${{ github.sha }}
          path: |
            assurance/licenses.json
            assurance/sbom.cdx.json
            assurance/synthetic-build.tar.gz
          if-no-files-found: error
          retention-days: 14

  attest:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download synthetic assurance artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: v031-assurance-${{ github.sha }}
          path: assurance

      - name: Attest synthetic artifact provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: assurance/synthetic-build.tar.gz
