name: Customer Update Policy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted customer main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - name: Check out pull request head without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false

      - name: Run trusted customer policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --dir trusted install --frozen-lockfile
          pnpm --dir trusted exec tsx scripts/customer-update/policy.ts \
            --repo-dir "$GITHUB_WORKSPACE/candidate" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --head-branch "$HEAD_BRANCH"
