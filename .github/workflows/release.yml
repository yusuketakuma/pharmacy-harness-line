name: Release Shared Pharmacy Service

on:
  push:
    tags:
      - 'v*.*.*'
      - 'pharmacy-v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact tagged source
        run: test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "$GITHUB_SHA"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check migrations
        run: pnpm tsx scripts/check-migrations.ts

      - name: Test repository scripts
        run: pnpm test:scripts

      - name: Build shared packages
        run: pnpm --filter @line-crm/shared --filter @line-crm/line-sdk --filter @line-crm/db --filter @line-harness/update-engine --filter @line-harness/sdk build

      - name: Typecheck workspace
        run: pnpm -r --workspace-concurrency=1 --if-present run typecheck

      - name: Test workspace
        run: pnpm -r --workspace-concurrency=1 --if-present run test

      - name: Build Worker
        run: pnpm --filter worker build

      - name: Build Admin
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
          NEXT_PUBLIC_LIFF_ORIGIN: https://liff.example.invalid
        run: pnpm --filter web build

      - name: Build Pharmacy LIFF
        env:
          VITE_API_BASE: https://api.example.invalid
        run: pnpm --filter liff build

      - name: Publish source release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
