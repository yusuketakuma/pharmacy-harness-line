name: Deploy Customer Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths:
      - 'apps/worker/**'
      - 'apps/liff/**'
      - 'apps/web/**'
      - 'packages/db/**'
      - 'packages/shared/**'
      - 'packages/line-sdk/**'
      - 'packages/update-engine/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-cloudflare.yml'

concurrency:
  group: ${{ github.repository }}-cloudflare-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository != 'Shudesu/line-harness-oss' && vars.LINE_HARNESS_CLOUDFLARE_DEPLOY == 'true' && (github.ref_name == 'main' || github.ref_name == 'dev')
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    runs-on: ubuntu-latest
    env:
      DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Verify deployment target
        run: |
          expected_target="${{ github.ref_name == 'main' && 'production' || 'development' }}"
          test "$DEPLOY_TARGET" = "$expected_target"

      - name: Validate required deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          PAGES_PROJECT_NAME: ${{ vars.PAGES_PROJECT_NAME }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          ADMIN_ORIGIN: ${{ vars.ADMIN_ORIGIN }}
          LIFF_ORIGIN: ${{ vars.LIFF_ORIGIN }}
          LIFF_PAGES_PROJECT: ${{ vars.LIFF_PAGES_PROJECT }}
          VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
          VITE_BOT_BASIC_ID: ${{ vars.VITE_BOT_BASIC_ID }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_NAME \
            D1_DATABASE_ID NEXT_PUBLIC_API_URL R2_BUCKET_NAME WORKER_NAME \
            PAGES_PROJECT_NAME LIFF_PAGES_PROJECT WORKER_URL ADMIN_ORIGIN \
            VITE_LIFF_ID VITE_BOT_BASIC_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing required deployment configuration: $name"
              exit 1
            fi
          done
          if [ "${NEXT_PUBLIC_API_URL%/}" != "${WORKER_URL%/}" ]; then
            echo "NEXT_PUBLIC_API_URL must match WORKER_URL"
            exit 1
          fi
          test -n "$LIFF_ORIGIN"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @line-crm/shared --filter @line-crm/line-sdk --filter @line-crm/db --filter @line-harness/update-engine build

      - name: Build Worker and LIFF assets
        run: pnpm --filter worker build
        env:
          VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
          VITE_BOT_BASIC_ID: ${{ vars.VITE_BOT_BASIC_ID }}
          VITE_CALENDAR_CONNECTION_ID: ${{ vars.VITE_CALENDAR_CONNECTION_ID }}

      - name: Build Pharmacy LIFF Pages
        run: |
          pnpm --filter liff build
          grep -R -Fq "$VITE_DEFAULT_LIFF_ID" apps/liff/dist/assets
          grep -R -Fq "$VITE_API_BASE" apps/liff/dist/assets
          grep -R -Fq "pharmacy-receive" apps/liff/dist/assets
        env:
          VITE_DEFAULT_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
          VITE_API_BASE: ${{ vars.WORKER_URL }}

      - name: Capture build metadata
        id: build-meta
        run: echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build Admin Panel
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          APP_BUILD_TIME: ${{ steps.build-meta.outputs.build_time }}

      - name: Verify LINE LIFF endpoint topology
        env:
          LIFF_ORIGIN: ${{ vars.LIFF_ORIGIN }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
        run: |
          wrapper="$(curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --max-time 20 "https://liff.line.me/${VITE_LIFF_ID}/")"
          if ! printf '%s' "$wrapper" | grep -Fq "$LIFF_ORIGIN"; then
            echo "LINE LIFF endpoint must point to LIFF_ORIGIN"
            exit 1
          fi
          if printf '%s' "$wrapper" | grep -Fq "$WORKER_URL"; then
            echo "LINE LIFF endpoint must not point to WORKER_URL"
            exit 1
          fi

      - name: Check additive migration safety
        run: pnpm tsx scripts/check-migrations.ts

      - name: Patch wrangler config
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          # These values declare the expected CORS topology. The protection
          # step below verifies them against the existing customer bindings
          # and restores the existing binding types and values before deploy.
          ADMIN_ORIGIN: ${{ vars.ADMIN_ORIGIN }}
          LIFF_ORIGIN: ${{ vars.LIFF_ORIGIN }}
          ADMIN_ALLOW_CROSS_SITE: ${{ vars.ADMIN_ALLOW_CROSS_SITE }}
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          test -n "$D1_DATABASE_ID"
          test -n "$R2_BUCKET_NAME"
          if [ "$DEPLOY_TARGET" = "development" ]; then
            case "$WORKER_NAME" in *-dev) ;; *) echo "Development Worker name must end in -dev"; exit 1 ;; esac
            case "$R2_BUCKET_NAME" in *-dev) ;; *) echo "Development R2 bucket name must end in -dev"; exit 1 ;; esac
          fi
          cd apps/worker
          sed -i \
            -e "s|\"account_id\":\"[^\"]*\"|\"account_id\":\"${CLOUDFLARE_ACCOUNT_ID}\"|g" \
            -e "s|\"database_name\":\"[^\"]*\"|\"database_name\":\"${D1_DATABASE_NAME}\"|g" \
            -e "s|\"database_id\":\"[^\"]*\"|\"database_id\":\"${D1_DATABASE_ID}\"|g" \
            dist/line_harness/wrangler.json
          tmp="$(mktemp)"
          jq --arg bucket "$R2_BUCKET_NAME" '
            .r2_buckets |= map(if .binding == "IMAGES" then .bucket_name = $bucket else . end)
          ' dist/line_harness/wrangler.json > "$tmp" && mv "$tmp" dist/line_harness/wrangler.json
          # Inject admin CORS vars into the deployed config when ADMIN_ORIGIN is
          # set. ADMIN_ALLOW_CROSS_SITE defaults to "true" (SameSite=None; Secure
          # cookies) since cross-origin admin/API is the case that needs it.
          if [ -n "$ADMIN_ORIGIN" ]; then
            tmp="$(mktemp)"
            jq --arg o "$ADMIN_ORIGIN" --arg x "$ADMIN_ALLOW_CROSS_SITE" --arg w "$WORKER_URL" '
              .vars.ADMIN_ORIGIN = $o
              | .vars.ADMIN_ALLOW_CROSS_SITE = (if $x == "" then "true" else $x end)
              | (if $w != "" then .vars.WORKER_URL = $w else . end)
            ' dist/line_harness/wrangler.json > "$tmp" && mv "$tmp" dist/line_harness/wrangler.json
            echo "Patched expected admin CORS vars"
          fi
          if [ -n "$LIFF_ORIGIN" ]; then
            tmp="$(mktemp)"
            jq --arg o "$LIFF_ORIGIN" '.vars.LIFF_ORIGIN = $o' \
              dist/line_harness/wrangler.json > "$tmp" && mv "$tmp" dist/line_harness/wrangler.json
            echo "Patched expected LIFF CORS vars"
          fi

      - name: Protect customer configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          PAGES_PROJECT_NAME: ${{ vars.PAGES_PROJECT_NAME }}
          ADMIN_ORIGIN: ${{ vars.ADMIN_ORIGIN }}
          LIFF_ORIGIN: ${{ vars.LIFF_ORIGIN }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          WRANGLER_CONFIG: apps/worker/dist/line_harness/wrangler.json
          CUSTOMER_CONFIG_SNAPSHOT: ${{ runner.temp }}/line-harness-customer-config.json
        run: pnpm tsx scripts/deploy/customer-config.ts prepare

      - name: Capture pre-migration release state
        id: before
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          PAGES_PROJECT_NAME: ${{ vars.PAGES_PROJECT_NAME }}
        run: |
          state="$(pnpm tsx scripts/deploy/release-state.ts --with-bookmark)"
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Run pending D1 migrations
        id: migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          result="$(pnpm tsx scripts/deploy/apply-migrations.ts)"
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          command: deploy --config dist/line_harness/wrangler.json --name ${{ vars.WORKER_NAME }}

      - name: Verify Worker health
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          test -n "$WORKER_URL"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "${WORKER_URL%/}/api/health" >/dev/null

      - name: Verify customer configuration preserved
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          CUSTOMER_CONFIG_SNAPSHOT: ${{ runner.temp }}/line-harness-customer-config.json
        run: pnpm tsx scripts/deploy/customer-config.ts verify

      - name: Deploy Pharmacy LIFF Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIFF_PAGES_PROJECT: ${{ vars.LIFF_PAGES_PROJECT }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$LIFF_PAGES_PROJECT"
          if [ "$DEPLOY_TARGET" = "development" ]; then
            case "$LIFF_PAGES_PROJECT" in *-dev) ;; *) echo "Development LIFF Pages project must end in -dev"; exit 1 ;; esac
          fi
          npx wrangler pages deploy apps/liff/dist \
            --project-name="$LIFF_PAGES_PROJECT" \
            --branch="$GITHUB_REF_NAME" \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="deploy $GITHUB_SHA"

      - name: Verify Pharmacy LIFF health
        env:
          LIFF_ORIGIN: ${{ vars.LIFF_ORIGIN }}
        run: |
          test -n "$LIFF_ORIGIN"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "${LIFF_ORIGIN%/}/" >/dev/null

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT_NAME: ${{ vars.PAGES_PROJECT_NAME }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          if [ "$DEPLOY_TARGET" = "development" ]; then
            case "$PAGES_PROJECT_NAME" in *-dev) ;; *) echo "Development Pages project must end in -dev"; exit 1 ;; esac
          fi
          npx wrangler pages deploy apps/web/out \
            --project-name="$PAGES_PROJECT_NAME" \
            --branch="$GITHUB_REF_NAME" \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="deploy $GITHUB_SHA"

      - name: Verify Admin health
        env:
          ADMIN_ORIGIN: ${{ vars.ADMIN_ORIGIN }}
        run: |
          test -n "$ADMIN_ORIGIN"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "${ADMIN_ORIGIN%/}/" >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "${ADMIN_ORIGIN%/}/prescriptions" >/dev/null

      - name: Capture deployed release state
        id: after
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          PAGES_PROJECT_NAME: ${{ vars.PAGES_PROJECT_NAME }}
        run: |
          state="$(pnpm tsx scripts/deploy/release-state.ts)"
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Record release evidence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          SOURCE_SHA: ${{ github.sha }}
          BEFORE_STATE: ${{ steps.before.outputs.state }}
          AFTER_STATE: ${{ steps.after.outputs.state }}
          MIGRATION_RESULT: ${{ steps.migrations.outputs.result }}
        run: pnpm tsx scripts/deploy/record-release-evidence.ts
