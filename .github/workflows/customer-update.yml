name: Prepare Customer Update

on:
  workflow_dispatch:
  schedule:
    - cron: '41 18 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: customer-vendor-update
  cancel-in-progress: false

jobs:
  prepare:
    if: vars.LINE_HARNESS_SELLER_REPOSITORY != '' && vars.LINE_HARNESS_SELLER_REPOSITORY != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted customer main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: main
          path: customer

      - name: Download seller release manifest
        env:
          GH_TOKEN: ${{ secrets.LINE_HARNESS_SELLER_READ_TOKEN }}
          SELLER_REPOSITORY: ${{ vars.LINE_HARNESS_SELLER_REPOSITORY }}
        run: |
          mkdir release
          gh release download \
            --repo "$SELLER_REPOSITORY" \
            --pattern release-manifest.json \
            --dir release \
            --clobber

      - name: Resolve exact seller tag
        id: target
        env:
          MANIFEST: release/release-manifest.json
        run: |
          tag=$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync(process.env.MANIFEST));const r=m.releases.find(x=>x.version===m.latest);if(!r?.customer_source_update)process.exit(1);process.stdout.write(r.customer_source_update.tag)")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out exact seller release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ vars.LINE_HARNESS_SELLER_REPOSITORY }}
          ref: ${{ steps.target.outputs.tag }}
          fetch-depth: 0
          path: seller
          token: ${{ secrets.LINE_HARNESS_SELLER_READ_TOKEN }}
          persist-credentials: false

      - name: Prepare trusted updater
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --dir customer install --frozen-lockfile
          git -C customer config user.name "github-actions[bot]"
          git -C customer config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while read -r _ ref; do
            test -z "$ref" || git -C customer fetch origin "$ref:$ref"
          done < <(git -C customer ls-remote --heads origin 'vendor/update-*')

      - name: Create or reuse update candidate
        id: prepare
        env:
          SELLER_REPOSITORY: ${{ vars.LINE_HARNESS_SELLER_REPOSITORY }}
        run: |
          result=$(pnpm --dir customer exec tsx scripts/customer-update/prepare.ts \
            --customer-dir "$GITHUB_WORKSPACE/customer" \
            --seller-dir "$GITHUB_WORKSPACE/seller" \
            --manifest "$GITHUB_WORKSPACE/release/release-manifest.json" \
            --seller-repository "$SELLER_REPOSITORY" \
            --base-branch main)
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Push new candidate
        if: fromJson(steps.prepare.outputs.result).kind == 'update'
        env:
          BRANCH: ${{ fromJson(steps.prepare.outputs.result).branch }}
        run: git -C customer push origin "$BRANCH"

      - name: Open or reuse pull request
        if: fromJson(steps.prepare.outputs.result).kind != 'noop'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJson(steps.prepare.outputs.result).branch }}
          GH_REPO: ${{ github.repository }}
          MANIFEST: release/release-manifest.json
        run: |
          update_class=$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync(process.env.MANIFEST));const r=m.releases.find(x=>x.version===m.latest);process.stdout.write(r.customer_source_update.update_class)")
          gh label create "vendor-update" --repo "$GH_REPO" --color 1d76db --force
          gh label create "vendor-$update_class" --repo "$GH_REPO" --color fbca04 --force
          if ! gh pr view "$BRANCH" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh pr create \
              --repo "$GH_REPO" \
              --base main \
              --head "$BRANCH" \
              --title "chore: update pharmacy release" \
              --body "Imports one verified immutable seller release. Review and required checks remain authoritative."
          fi
          gh pr edit "$BRANCH" --repo "$GH_REPO" --add-label "vendor-update,vendor-$update_class"
